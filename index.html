 // checkpoints

  else{for(const u of ufos)if(!u.dead&&Math.abs(s.x-u.x)<22&&Math.abs(s.y-u.y)<12){s.l=0;u.dead=1;score+=200;pop('+200',u.x,GY+u.y*S,'#7fff7f');SND.ufo();burst(SX(u.x),GY+u.y*S,22,['#7fff7f','#fff','#ff5ad8','#ffd34a'])}

// ---------- draw
function drawBG(){let gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#05030f');gr.addColorStop(1,'#2a1458');g.fillStyle=gr;g.fillRect(0,0,W,GY);

 layer(.08,'#3a2470',GY-40*S,120*S,40*S,1);layer(.25,'#24184a',GY-10*S,70*S,26*S,4);
